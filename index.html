<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sri Hari Tyres - Live Alignment Queue</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}header{background:#151515;border-bottom:3px solid #e31b23;padding:22px;text-align:center}.logo{font-size:30px;font-weight:900}.sub{color:#aaa;letter-spacing:2px;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#171717;border-radius:16px;padding:22px;margin-bottom:18px}.row{display:flex;gap:12px;flex-wrap:wrap}input,select{flex:1;min-width:210px;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:10px;padding:15px;font-size:17px}button{border:0;border-radius:10px;padding:14px 18px;font-weight:800;font-size:15px}.add{background:#e31b23;color:#fff}.white{background:#fff;color:#111}.dark{background:#444;color:#fff}.status{padding:10px;border-radius:8px;background:#222;color:#aaa;margin-bottom:15px}.item{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #333}.num{font-size:20px;font-weight:800}.model,.tech{color:#aaa}.tech{margin-top:4px}.tv{text-align:center;min-height:100vh;background:#080808}.tv header{padding:28px}.tv .logo{font-size:42px}.tv .wrap{max-width:1450px}.tvcard{background:#141414;border-radius:24px;padding:35px;border:2px solid #e31b23}.now{font-size:76px;font-weight:900;margin-top:15px}.next{margin-top:22px;background:#141414;border-radius:20px;padding:25px}.nextnum{font-size:45px;font-weight:900}.tvtech{font-size:22px;color:#aaa;margin-top:8px}.wait{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.wait div{background:#161616;padding:18px;border-radius:12px;font-size:25px}.small{font-size:12px;color:#888;margin-top:12px}@media(max-width:700px){.now{font-size:48px}.nextnum{font-size:32px}.wait{grid-template-columns:1fr}}
</style></head><body><div id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import{getDatabase,ref,onValue,set}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const saved=localStorage.getItem("sht_firebase_config");let cfg=null;try{cfg=JSON.parse(saved||"null")}catch(e){}
if(!cfg||!cfg.databaseURL||String(cfg.apiKey||"").startsWith("PASTE_"))setup();else start();
function setup(){document.body.innerHTML=`<header><div class="logo">SRI HARI TYRES</div><div class="sub">LIVE ALIGNMENT QUEUE</div></header><div class="wrap"><div class="card"><h2>Firebase Setup</h2><p>Paste the Firebase Web App configuration from your Firebase project.</p><textarea id="cfg" style="width:100%;height:220px;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:10px;padding:14px;font-family:monospace"></textarea><br><br><button class="add" id="save">SAVE & CONNECT</button><div class="small">Saved only in this browser.</div></div></div>`;document.getElementById("cfg").value=localStorage.getItem("sht_firebase_config")||`{"apiKey":"PASTE_API_KEY","authDomain":"YOUR_PROJECT.firebaseapp.com","databaseURL":"https://YOUR_PROJECT-default-rtdb.firebaseio.com","projectId":"YOUR_PROJECT_ID","storageBucket":"YOUR_PROJECT.appspot.com","messagingSenderId":"YOUR_SENDER_ID","appId":"YOUR_APP_ID"}`;document.getElementById("save").onclick=()=>{try{JSON.parse(document.getElementById("cfg").value);localStorage.setItem("sht_firebase_config",document.getElementById("cfg").value);location.reload()}catch(e){alert("Invalid JSON")}}}
function start(){const db=getDatabase(initializeApp(cfg)),qref=ref(db,"sriHariTyres/alignmentQueue");let queue=[];onValue(qref,s=>{queue=s.val()||[];render();renderTV()});const technicians=["Aravind","Arjun","Arivazhagan","Sarath","Venkatesh","Vijay"];const mode=new URLSearchParams(location.search).get("mode");if(mode==="tv")tv();else staff();function write(){return set(qref,queue)}function add(){let v=document.getElementById("vehicle").value.trim().toUpperCase(),m=document.getElementById("model").value.trim(),t=document.getElementById("tech").value;if(!v||!m||!t)return alert("Enter vehicle number, model and technician");queue=[...queue,{id:Date.now(),vehicle:v,model:m,technician:t}];write();document.getElementById("vehicle").value="";document.getElementById("model").value=""}function complete(){if(queue.length){queue=queue.slice(1);write()}}function callNext(){if(queue.length>1){queue=[...queue.slice(1),queue[0]];write()}}function clearAll(){if(confirm("Clear the whole queue?")){queue=[];write()}}
function staff(){document.body.innerHTML=`<header><div class="logo">SRI HARI TYRES</div><div class="sub">CEAT • LIVE WHEEL ALIGNMENT QUEUE</div></header><div class="wrap"><div class="card"><div class="status">🟢 LIVE QUEUE CONNECTED</div><h2>Add Vehicle</h2><div class="row"><input id="vehicle" placeholder="Vehicle Number • TN 49 AB 1234"><input id="model" placeholder="Model • Tata Punch"><select id="tech"><option value="">Select Technician</option>${technicians.map(x=>`<option>${x}</option>`).join("")}</select><button class="add" id="add">ADD TO QUEUE</button></div><div class="small">TV display: open the same website with <b>?mode=tv</b></div></div><div class="card"><h2>Live Queue</h2><div id="list"></div><div class="row" style="margin-top:16px"><button class="white" id="complete">COMPLETED</button><button class="dark" id="next">CALL NEXT</button><button class="dark" id="clear">CLEAR ALL</button></div></div></div>`;document.getElementById("add").onclick=add;document.getElementById("complete").onclick=complete;document.getElementById("next").onclick=callNext;document.getElementById("clear").onclick=clearAll;render()}
function render(){let list=document.getElementById("list");if(!list)return;list.innerHTML=queue.length?queue.map((x,i)=>`<div class="item"><div><div class="num">${i===0?"🟢 ":""}${x.vehicle}</div><div class="model">${x.model}</div><div class="tech">👨‍🔧 ${x.technician}</div></div><b>${i===0?"NOW":i===1?"NEXT":"WAITING"}</b></div>`).join(""):"<div class='model'>No vehicles waiting.</div>"}
function tv(){document.body.className="tv";document.body.innerHTML=`<header><div class="logo">SRI HARI TYRES</div><div class="sub">CEAT • WHEEL ALIGNMENT</div></header><div class="wrap"><div class="tvcard"><div class="sub">NOW SERVING</div><div id="now"></div></div><div class="next"><div class="sub">NEXT VEHICLE</div><div id="next"></div></div><h2>WAITING QUEUE</h2><div class="wait" id="wait"></div></div>`;renderTV()}
function renderTV(){let n=document.getElementById("now");if(!n)return;if(!queue.length){n.innerHTML="<div class='now'>NO VEHICLE</div>";document.getElementById("next").innerHTML="<div class='nextnum'>—</div>";document.getElementById("wait").innerHTML="";return}n.innerHTML=`<div class="now">${queue[0].vehicle}</div><div class="nextnum" style="font-size:28px;color:#bbb">${queue[0].model}</div><div class="tvtech">👨‍🔧 Technician: ${queue[0].technician}</div>`;document.getElementById("next").innerHTML=queue[1]?`<div class="nextnum">${queue[1].vehicle}</div><div class="tvtech">${queue[1].model} • 👨‍🔧 ${queue[1].technician}</div>`:"<div class='nextnum'>—</div>";document.getElementById("wait").innerHTML=queue.slice(2).map(x=>`<div><b>${x.vehicle}</b><br><span class="model">${x.model}</span><br><span class="tech">👨‍🔧 ${x.technician}</span></div>`).join("")}}
</script></body></html>
